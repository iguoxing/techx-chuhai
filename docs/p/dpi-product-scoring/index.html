    <noscript><div class="noscript">本站文章由 Markdown 即时渲染，请开启 JavaScript。<br><br>正文预览：<pre>本文是站点搭建时的示例文章，用来演示排版效果，可随时删除或替换成你的正文。
先说结论
选品最怕的不是选错，而是说不清为什么选错，下次继续犯同一个错。给每个候选品打一张分，留下打分依据，半年后回头看才知道自己的判断偏在哪。
DPI 模型
五个维度各打 0–10 分，总分范围 −20  30。低于 10 分先别碰，15 分以上才值得做最小验证。
维度 | 打分依据 | 数据来源 |
--- | --- | --- |
需求规模 | 月搜索量、进口额、主流平台销量 | 海关数据、关键词工具、平台榜单 |
增长动能 | 近 12 个月同比增速、趋势斜率 | 海关数据、Google Trends |
竞争烈度 | 头部集中度、广告竞价、同质化程度 | 搜索结果前两页、广告库 |
进入门槛 | 认证、IP 授权、资金、账期 | 平台规则、同行访谈 |
供应链匹配 | 你能否稳定拿货、起订量、毛利 | 自己已有的供应商清单 |
一个真实好用的判断顺序
别一上来就把五个维度都查全，按下面的顺序，任一环节不过就直接淘汰，能省掉大量调研时间：
1. 先查门槛（10 分钟）：有没有 IP 授权、强制认证、平台禁售？有且拿不到 → 直接出局
2. 再查供应链（半小时）：现有资源能不能供货、毛利够不够 30%？不够 → 出局
3. 最后才查需求和竞争（半天以上）：这一步最费时，放到最后做
很多人把顺序反过来</pre></div></noscript>

<script type="application/json" id="post-source">"\u003e 本文是站点搭建时的示例文章，用来演示排版效果，可随时删除或替换成你的正文。\n\n## 先说结论\n\n选品最怕的不是选错，而是**说不清为什么选错**，下次继续犯同一个错。给每个候选品打一张分，留下打分依据，半年后回头看才知道自己的判断偏在哪。\n\n## DPI 模型\n\n```\nDPI = 需求规模 + 增长动能 − 竞争烈度 − 进入门槛 + 供应链匹配\n```\n\n五个维度各打 0–10 分，总分范围 −20 ~ 30。**低于 10 分先别碰，15 分以上才值得做最小验证。**\n\n| 维度 | 打分依据 | 数据来源 |\n| --- | --- | --- |\n| 需求规模 | 月搜索量、进口额、主流平台销量 | 海关数据、关键词工具、平台榜单 |\n| 增长动能 | 近 12 个月同比增速、趋势斜率 | 海关数据、Google Trends |\n| 竞争烈度 | 头部集中度、广告竞价、同质化程度 | 搜索结果前两页、广告库 |\n| 进入门槛 | 认证、IP 授权、资金、账期 | 平台规则、同行访谈 |\n| 供应链匹配 | 你能否稳定拿货、起订量、毛利 | 自己已有的供应商清单 |\n\n## 一个真实好用的判断顺序\n\n别一上来就把五个维度都查全，按下面的顺序，**任一环节不过就直接淘汰**，能省掉大量调研时间：\n\n1. **先查门槛**（10 分钟）：有没有 IP 授权、强制认证、平台禁售？有且拿不到 → 直接出局\n2. **再查供应链**（半小时）：现有资源能不能供货、毛利够不够 30%？不够 → 出局\n3. **最后才查需求和竞争**（半天以上）：这一步最费时，放到最后做\n\n\u003e 很多人把顺序反过来，花两周调研出一个很热的品，最后发现根本拿不到货或者要授权，白干。\n\n## 打分示例（演示用，非真实建议）\n\n| 维度 | 正品卡牌 DTC | 卡牌周边配件 |\n| --- | --- | --- |\n| 需求规模 | 9 | 6 |\n| 增长动能 | 8 | 7 |\n| 竞争烈度 | −9 | −4 |\n| 进入门槛 | −10（IP 授权） | −2 |\n| 供应链匹配 | 3 | 8 |\n| **DPI** | **1** | **15** |\n\n同一个赛道，换个切入角度结论完全相反：**壁垒不在需求端，而在你能不能合法地、稳定地把货交出去。**\n\n## 打分表怎么维护\n\n建议直接建一张表，一行一个候选品，列就是五个维度 + 一句话依据 + 结论 + 复盘日期：\n\n```text\n品类 | 需求 | 增长 | 竞争 | 门槛 | 供应链 | DPI | 打分依据 | 结论 | 复查日期\n---- | ---- | ---- | ---- | ---- | ------ | --- | -------- | ---- | --------\nxxx  |  6   |  7   |  -4  |  -2  |   8    | 15 | 见备注A  | 小批量试 | 2026-12-19\n```\n\n三个约定：\n\n- **打分必须附依据**，只写数字不给来源，等于没打\n- **设复查日期**，市场会变，三个月前的 6 分可能现在是 3 分\n- **记录被淘汰的品**，负面结论同样是资产\n\n## 小结\n\n模型本身不值钱，值钱的是「留痕 + 复盘」。先用门槛和供应链快速砍掉 80% 的候选，再对剩下的做深调研，选品效率会高一个量级。下一步动作：把手上 5 个候选品按上面的表打一遍分，只留下 15 分以上的那个去做验证。"</script>
