案例背景
Slack 诞生于 Tiny Speck 公司内部沟通工具，游戏业务失败后转型做企业协作。当时企业软件的主流是销售驱动：找决策者、做演示、走采购流程，周期长、成本高。Slack 选择了另一条路。
核心困境
企业采购决策慢、预算审批难。你要如何让一个从未听过你产品的公司，在没有销售拜访的情况下开始使用，并且越用越多人？
关键事实
- 时间：2013 年正式发布，2019 年上市（公开报道）
- 入口：免费工作区，任何人都可注册并邀请同事
- 传播单位：不是个人，而是团队——每次邀请都把产品带进新的组织关系
- 护城河：频道历史、集成工具、工作流沉淀，用得越久迁移成本越高
分析框架：产品主导增长（PLG）× 团队病毒系数
1. 自下而上：先让一线团队用起来，使用人数扩散到一定规模后，公司自然愿意付费买合规与管理功能。
2. 团队 K 因子：一次邀请带来的是一个团队，而不是一个孤立用户。传播单位越大，病毒系数越高。
3. 首次价值时间：从注册到团队里第二个人回复消息，越短越好——产品价值来自协作，不是注册本身。
4. 扩展路径：团队 → 部门 → 全公司，每一步靠真实使用推进</pre></div></noscript>

<script type="application/json" id="post-source">"\u003e 本文是「增长黑客 MBA 案例」系列第 07 篇。按案例教学结构写：背景 → 困境 → 关键事实 → 分析框架 → 当时的决策 → 结果 → 课堂讨论题 → 出海迁移。只做公开资料的二次分析，不复制原文。\n\n## 案例背景\n\nSlack 诞生于 Tiny Speck 公司内部沟通工具，游戏业务失败后转型做企业协作。当时企业软件的主流是销售驱动：找决策者、做演示、走采购流程，周期长、成本高。Slack 选择了另一条路。\n\n## 核心困境\n\n\u003e 企业采购决策慢、预算审批难。你要如何让一个从未听过你产品的公司，在没有销售拜访的情况下开始使用，并且越用越多人？\n\n## 关键事实\n\n- **时间**：2013 年正式发布，2019 年上市（公开报道）\n- **入口**：免费工作区，任何人都可注册并邀请同事\n- **传播单位**：不是个人，而是团队——每次邀请都把产品带进新的组织关系\n- **护城河**：频道历史、集成工具、工作流沉淀，用得越久迁移成本越高\n\n## 分析框架：产品主导增长（PLG）× 团队病毒系数\n\n1. **自下而上**：先让一线团队用起来，使用人数扩散到一定规模后，公司自然愿意付费买合规与管理功能。\n2. **团队 K 因子**：一次邀请带来的是一个团队，而不是一个孤立用户。传播单位越大，病毒系数越高。\n3. **首次价值时间**：从注册到团队里第二个人回复消息，越短越好——产品价值来自协作，不是注册本身。\n4. **扩展路径**：团队 → 部门 → 全公司，每一步靠真实使用推进，而非销售承诺。\n\n## 当时的决策与执行\n\n1. 开放免费工作区，不设销售门槛，让团队自助试用。\n2. 把邀请同事做成核心动作：建频道、发消息都自然触发邀请提示。\n3. 接入大量第三方工具，让 Slack 变成团队的工作入口，提高迁移成本。\n4. 免费版功能足够团队用，但把管理、合规、历史留存放在付费版。\n\n## 结果\n\n从创业公司内部工具成长为全球企业协作标杆，2019 年完成上市（公开报道）。PLG 成为此后企业软件的主流范式之一。\n\n## 课堂讨论题\n\n1. 为什么 PLG 更适合「协作型」产品，而不适合所有 B2B 工具？\n2. 免费版该给多少功能？给太少没人用，给太多没人付费，你的判断线是什么？\n3. 如果产品只有一个决策者使用（比如财务软件），PLG 还成立吗？\n\n## 迁移到出海场景\n\nB2B 出海做 PLG，关键是找到「一个发了邀请就产生价值」的场景。可照做的动作：把产品里最需要协作的那一步（共享报价、共同审核、多人查看报告）做成免注册可访问的链接，发给客户团队里的其他人；当三个人都在用你的链接协作时，成交概率远高于只搞定一个采购。对中小出海团队，这是一个几乎零成本的冷启动方式。\n\n## 别踩的坑\n\n\u003e PLG 不等于「做个免费版放着」。没有邀请机制、没有协作场景、没有明确的付费转化点，免费版只会变成永远不转化的流量。另外，纯 PLG 对大客户销售支持不足，规模化后往往要补上销售团队。\n\n## 一句话结论\n\n**协作型产品，让团队成为增长单位。**\n\n---\n\n*参考：[Slack · Wikipedia](https://en.wikipedia.org/wiki/Slack_(software))（部分条目在境内需代理访问）。本系列共 20 篇，站点首页切到「MBA案例」栏目可看全部。案例基于公开资料整理，数据以原始披露为准。*"</script>
